  <!-- Anti-flicker theme script -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('smartdocs-theme') || 'dark';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(savedTheme);
      } catch (e) {}
    })();
  </script>
